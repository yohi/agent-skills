<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    input, button { display: block; margin: 0.5rem 0; padding: 0.5rem; }
    #status { margin-top: 1rem; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <form id="settings-form">
    <input type="text" id="setting-name" placeholder="Setting name" value="theme" />
    <input type="text" id="setting-value" placeholder="Setting value" value="dark" />
    <button type="submit" id="save-button">Save</button>
  </form>
  <div id="status"></div>
  <script src="/app.js"></script>
  <script>
    document.getElementById('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await saveSettings();
    });
  </script>
</body>
</html>
